<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Think UX Hero Image</title>
  <!-- Background -->
  <rect width="1200" height="400" fill="#FFFFFF" rx="24"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Subtle background pattern or shapes -->
  <circle cx="950" cy="200" r="150" fill="#E8F1FA" />
  <circle cx="1050" cy="150" r="100" fill="#FFF4EC" />
  
  <!-- Content -->
  <text x="80" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#1A1A1A" letter-spacing="-1.5">Think UX</text>
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="#2E7FC6">Agency Portfolio Platform</text>
  
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6B7280">Built with Next.js 16, Tailwind v4 &amp; Framer Motion</text>
  
  <!-- A minimal UI representation on the right -->
  <g transform="translate(750, 80)">
    <!-- Browser/App Window -->
    <rect width="360" height="260" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#E5E7EB" />
    <circle cx="32" cy="20" r="4" fill="#E5E7EB" />
    <circle cx="44" cy="20" r="4" fill="#E5E7EB" />
    <rect x="16" y="40" width="328" height="1" fill="#E5E7EB" />
    <!-- Content mock -->
    <rect x="24" y="60" width="120" height="16" rx="4" fill="#2E7FC6" opacity="0.2"/>
    <rect x="24" y="88" width="200" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="24" y="104" width="180" height="8" rx="4" fill="#E5E7EB"/>
    
    <!-- Image grids -->
    <rect x="24" y="130" width="150" height="100" rx="8" fill="#FFF4EC"/>
    <rect x="186" y="130" width="150" height="100" rx="8" fill="#E8F1FA"/>
  </g>
</svg>
